name: Gazeling
options:
  bundleIdPrefix: com.danielabar
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
packages:
  GazelingKit:
    path: Packages/GazelingKit
targets:
  Gazeling:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: GazelingKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielabar.gazeling
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: App/Gazeling.entitlements
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        SWIFT_EMIT_LOC_STRINGS: YES
