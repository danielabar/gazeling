name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch when a newer commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Unit tests (GazelingKit package)
        run: make test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the app
        run: make build
